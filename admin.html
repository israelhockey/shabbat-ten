<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1B1640">
<title>Shabbat Ten · Host</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#1B1640; --deep:#14102F; --card:#262056; --card2:#2E2763; --line:#4A4178;
  --ink:#F4EFFF; --muted:#BDB4DA; --coral:#FF8A6B; --lilac:#C9B6FF;
  --ok:#7FE0B0; --warn:#FFD27A; --err:#FF8F7A; --wa:#25D366;
  --serif:"Instrument Serif",Georgia,serif; --sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:60px}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lilac);outline-offset:2px;border-radius:6px}
a{color:var(--lilac)}
.wrap{max-width:1100px;margin:0 auto}
h1,h2{font-family:var(--serif);font-weight:400;margin:0;line-height:1.05}
.muted{color:var(--muted)} .small{font-size:13px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--lilac)}

header{position:sticky;top:0;z-index:5;background:rgba(27,22,64,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:12px max(16px,env(safe-area-inset-left,0px));padding-top:calc(12px + env(safe-area-inset-top,0px))}
header .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--serif);font-size:24px;margin-right:auto}
.logo i{color:var(--coral)}
.tabs{display:flex;gap:4px;background:var(--deep);border-radius:999px;padding:4px}
.tab{border:0;background:none;border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--card2);color:var(--ink)}

.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);min-height:42px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--coral);border-color:var(--coral);color:var(--bg)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#08331a}

input[type=text],input[type=email],input[type=password],input[type=date],input[type=number],input[type=url],select,textarea{
  width:100%;border:1px solid var(--line);background:var(--deep);border-radius:12px;padding:10px 12px;min-height:44px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--lilac);outline:none}
label{font-size:13px;font-weight:700;display:block;margin-bottom:5px}
.field{min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.panel{background:var(--card);border-radius:20px;padding:18px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:700;padding:10px 18px;border-radius:999px;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:calc(100vw - 32px)}

/* login */
.login{max-width:380px;margin:12vh auto 0}
.login h1{font-size:44px;margin-bottom:6px}
.login h1 i{color:var(--coral)}
.errmsg{color:var(--err);font-size:14px}

/* applicants */
.top{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin:22px 0 14px}
.top .field{flex:1 1 260px}
.counts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.count{background:var(--card);border-radius:16px;padding:12px 14px}
.count b{display:block;font-family:var(--serif);font-size:30px;font-weight:400;line-height:1.1;font-variant-numeric:tabular-nums}
.count b.over{color:var(--err)}
.count span{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--lilac);border-color:var(--lilac);color:var(--bg)}
.apps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.app{background:var(--card);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px;border-left:0}
.app-head{display:flex;gap:14px}
.selfie{width:96px;height:120px;border-radius:14px;object-fit:cover;background:var(--deep);flex:none;cursor:zoom-in}
.who{min-width:0;flex:1}
.who h3{margin:0;font-size:18px;overflow-wrap:anywhere}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--deep);color:var(--muted)}
.tag.m{color:var(--lilac)} .tag.f{color:var(--coral)}
.status{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:4px 10px}
.st-pending{background:rgba(201,182,255,.15);color:var(--lilac)}
.st-approved{background:rgba(127,224,176,.15);color:var(--ok)}
.st-waitlist{background:rgba(255,210,122,.15);color:var(--warn)}
.st-denied{background:rgba(255,143,122,.15);color:var(--err)}
.details{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:14px}
.details dt{color:var(--muted)} .details dd{margin:0;overflow-wrap:anywhere}
.bio{font-size:14px;color:var(--muted);background:var(--deep);border-radius:12px;padding:10px 12px;margin:0}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.actions .btn{flex:1 1 auto;justify-content:center}
.act-approve[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#0b3322}
.act-waitlist[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#3a2a00}
.act-deny[aria-pressed="true"]{background:var(--err);border-color:var(--err);color:#3a0d05}
.paidrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--line)}
.switch{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--ok)}
.empty{padding:40px 16px;text-align:center;color:var(--muted);background:var(--card);border-radius:20px}

/* dinners */
.dlist{display:grid;gap:12px;margin-top:16px}
.drow{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:18px;padding:10px;flex-wrap:wrap}
.drow img{width:110px;height:72px;object-fit:cover;border-radius:12px;flex:none}
.drow .info{flex:1 1 200px;min-width:0}
.drow h3{margin:0;font-family:var(--serif);font-weight:400;font-size:24px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.photo{border:2px solid transparent;border-radius:12px;padding:0;background:none;cursor:pointer;overflow:hidden;aspect-ratio:16/11}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo[aria-pressed="true"]{border-color:var(--coral)}
.upload{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;border:2px dashed var(--line);border-radius:12px;aspect-ratio:16/11;cursor:pointer;color:var(--muted);font-size:13px;font-weight:700;text-align:center;padding:6px}
.preview{border-radius:16px;overflow:hidden;background:var(--deep)}
.preview img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.preview .pb{padding:12px 14px}
.preview h3{margin:2px 0 4px;font-family:var(--serif);font-weight:400;font-size:26px}

.lightbox{position:fixed;inset:0;background:rgba(10,8,24,.92);z-index:30;display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:90vh;border-radius:16px}

@media (max-width:760px){
  .apps,.grid2{grid-template-columns:1fr}
  .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .counts{grid-template-columns:repeat(2,minmax(0,1fr))}
  header .wrap{gap:8px}
  .tabs{order:3;width:100%;justify-content:space-between}
  .tab{flex:1}
}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="v-login" class="login" hidden>
  <h1>Shabbat <i>Ten</i></h1>
  <p class="muted">Host login</p>
  <form id="loginForm" class="stack">
    <div class="field"><label for="lEmail">Email</label><input id="lEmail" type="email" autocomplete="username" required></div>
    <div class="field"><label for="lPass">Password</label><input id="lPass" type="password" autocomplete="current-password" required></div>
    <p class="errmsg" id="lErr" hidden></p>
    <button class="btn primary" type="submit" id="lBtn" style="justify-content:center">Log in</button>
    <button class="btn ghost sm" type="button" id="forgot" style="align-self:center">Forgot password?</button>
  </form>
</section>

<!-- APP -->
<div id="v-app" hidden>
<header><div class="wrap">
  <div class="logo">Shabbat <i>Ten</i> <span class="small muted" style="font-family:var(--sans)">host</span></div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="apps" aria-selected="true">Applicants</button>
    <button class="tab" role="tab" data-tab="dinners" aria-selected="false">Dinners</button>
    <button class="tab" role="tab" data-tab="settings" aria-selected="false">Settings</button>
  </div>
  <button class="btn ghost sm" id="logout" type="button">Log out</button>
</div></header>

<main class="wrap">
  <!-- APPLICANTS -->
  <section id="t-apps">
    <div class="top">
      <div class="field"><label for="dinnerSel">Dinner</label><select id="dinnerSel"></select></div>
      <button class="btn sm" id="refresh" type="button">Refresh</button>
      <button class="btn sm" id="csv" type="button">Export CSV</button>
    </div>
    <div class="counts" id="counts"></div>
    <div class="filters" id="filters"></div>
    <div class="apps" id="apps"></div>
  </section>

  <!-- DINNERS -->
  <section id="t-dinners" hidden>
    <div class="top" style="justify-content:space-between">
      <h1 style="font-size:40px">Dinners</h1>
      <button class="btn primary" id="newDinner" type="button">+ Add dinner</button>
    </div>
    <div id="editor" hidden></div>
    <div class="dlist" id="dlist"></div>
  </section>

  <!-- SETTINGS -->
  <section id="t-settings" hidden>
    <div class="top"><h1 style="font-size:40px">Messages &amp; Bit</h1></div>
    <form id="setForm" class="stack panel">
      <div class="grid3">
        <div class="field"><label for="s_bit_phone">Bit phone number</label><input id="s_bit_phone" type="text" placeholder="052-123-4567"></div>
        <div class="field"><label for="s_bit_link">Bit payment link <span class="muted">(optional)</span></label><input id="s_bit_link" type="text" placeholder="https://www.bitpay.co.il/…"></div>
        <div class="field"><label for="s_pay_hours">Hours to pay</label><input id="s_pay_hours" type="number" min="1" max="168"></div>
      </div>
      <p class="small muted" style="margin:0">Words in curly brackets fill in automatically: {first} {name} {dinner} {date} {price} {hours} {bit_phone} {bit_link}</p>
      <div class="field"><label for="s_msg_approved">Approved message</label><textarea id="s_msg_approved" rows="6"></textarea></div>
      <div class="field"><label for="s_msg_waitlist">Waitlist message</label><textarea id="s_msg_waitlist" rows="4"></textarea></div>
      <div class="field"><label for="s_msg_denied">Not-this-time message</label><textarea id="s_msg_denied" rows="4"></textarea></div>
      <div class="row"><button class="btn primary" type="submit">Save settings</button></div>
    </form>
  </section>
</main>
</div>

<div class="lightbox" id="lightbox" hidden><img alt="Applicant selfie, enlarged"></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js?v=20261119b"></script>
<script>
const LINK_TYPE=((location.hash+location.search).match(/type=(invite|recovery)/)||[])[1]||null;
const sb=window.supabase.createClient(ST_CONFIG.SUPABASE_URL,ST_CONFIG.SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fdate=d=>{const x=new Date(d+"T12:00:00");return `${DAYS[x.getDay()]}, ${MON[x.getMonth()]} ${x.getDate()}, ${x.getFullYear()}`};
const STOCK=["media/table.jpg","media/challah1.jpg","media/challah2.jpg","media/t.jpg","media/c.jpg"];
const REL={single:"Single",relationship:"In a relationship",married:"Married"};
const OBS={orthodox:"Orthodox",dati_leumi:"Dati Leumi",masorti:"Masorti",secular:"Secular",other:"Other"};
const KOSHER={full:"Kosher in & out",home:"Kosher at home",none:"Not kosher"};
const obsText=a=>a.observance?(a.observance==="other"?(a.observance_other||"Other"):OBS[a.observance]):"";
function toast(t){const e=$("toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}
function ageOf(v){const b=new Date(v),n=new Date();let a=n.getFullYear()-b.getFullYear();const m=n.getMonth()-b.getMonth();if(m<0||(m===0&&n.getDate()<b.getDate()))a--;return a}

let DINNERS=[],APPS=[],SETTINGS={},filter="all",armed=null;

/* ── auth ── */
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){showLogin();return}
  if(LINK_TYPE){showSetPassword();return}
  const {data}=await sb.from("admins").select("user_id").eq("user_id",session.user.id).maybeSingle();
  if(!data){await sb.auth.signOut();showLogin("This account isn't set up as a host.");return}
  $("v-login").hidden=true;$("v-app").hidden=false;
  await Promise.all([loadDinners(),loadSettings()]);
  pickDefaultDinner();await loadApps();
}
function showLogin(msg){$("v-app").hidden=true;$("v-login").hidden=false;const e=$("lErr");e.hidden=!msg;e.textContent=msg||""}
$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();$("lBtn").disabled=true;
  const {error}=await sb.auth.signInWithPassword({email:$("lEmail").value.trim(),password:$("lPass").value});
  $("lBtn").disabled=false;
  if(error){showLogin("Wrong email or password.");return}
  boot();
});
$("forgot").onclick=async()=>{
  const email=$("lEmail").value.trim();
  if(!email){showLogin("Type your email above first.");return}
  await sb.auth.resetPasswordForEmail(email,{redirectTo:location.href.split("#")[0]});
  showLogin("If that email is a host account, a reset link is on its way.");
};
function showSetPassword(){
  $("v-app").hidden=true;$("v-login").hidden=false;
  const old=$("loginForm"),f=old.cloneNode(false);old.replaceWith(f);
  f.innerHTML=`<p class="muted" style="margin:0">${LINK_TYPE==="invite"?"Welcome! Choose a password for your host account.":"Choose a new password."}</p>
    <div class="field"><label for="newPass">New password</label><input id="newPass" type="password" minlength="8" autocomplete="new-password" required></div>
    <p class="errmsg" id="pErr" hidden></p>
    <button class="btn primary" type="submit" style="justify-content:center">Save password</button>`;
  f.addEventListener("submit",async e=>{
    e.preventDefault();
    const {error}=await sb.auth.updateUser({password:$("newPass").value});
    if(error){$("pErr").textContent=error.message;$("pErr").hidden=false;return}
    history.replaceState(null,"",location.pathname);location.reload();
  });
}
sb.auth.onAuthStateChange(ev=>{if(ev==="PASSWORD_RECOVERY"&&!LINK_TYPE)showSetPassword()});
$("logout").onclick=async()=>{await sb.auth.signOut();location.reload()};

/* ── tabs ── */
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===t));
  ["apps","dinners","settings"].forEach(k=>$("t-"+k).hidden=k!==t.dataset.tab);
  window.scrollTo(0,0);
});

/* ── dinners data ── */
async function loadDinners(){
  const {data,error}=await sb.from("dinners").select("*").order("dinner_date",{ascending:false});
  if(error){toast("Couldn't load dinners");return}
  DINNERS=data;renderDinnerSelect();renderDinnerList();
}
function renderDinnerSelect(){
  const sel=$("dinnerSel"),keep=sel.value;
  sel.innerHTML=DINNERS.length?DINNERS.map(d=>`<option value="${d.id}">${esc(fdate(d.dinner_date))} · ${esc(d.title)}${d.published?"":" (hidden)"}</option>`).join(""):`<option value="">No dinners yet</option>`;
  if(keep&&DINNERS.some(d=>d.id===keep))sel.value=keep;
}
function pickDefaultDinner(){
  const today=new Date().toISOString().slice(0,10);
  const up=[...DINNERS].filter(d=>d.dinner_date>=today).sort((a,b)=>a.dinner_date.localeCompare(b.dinner_date))[0];
  if(up)$("dinnerSel").value=up.id;
}
$("dinnerSel").onchange=()=>{filter="all";loadApps()};
$("refresh").onclick=()=>loadApps();

/* ── applicants ── */
async function loadApps(){
  const id=$("dinnerSel").value;
  if(!id){APPS=[];renderApps();return}
  $("apps").innerHTML=`<div class="empty" style="grid-column:1/-1">Loading applicants…</div>`;
  const {data,error}=await sb.from("applications").select("*").eq("dinner_id",id).order("created_at");
  if(error){$("apps").innerHTML=`<div class="empty" style="grid-column:1/-1">Couldn't load applicants. Tap Refresh.</div>`;return}
  APPS=data;
  const paths=APPS.map(a=>a.selfie_path);
  if(paths.length){
    const {data:urls}=await sb.storage.from("selfies").createSignedUrls(paths,3600);
    (urls||[]).forEach((u,i)=>{APPS[i]._img=u.signedUrl});
  }
  renderApps();
}
const dinner=()=>DINNERS.find(d=>d.id===$("dinnerSel").value);
function tally(){
  const t={m:0,f:0,paid:0,pending:0,approved:0,waitlist:0,denied:0};
  APPS.forEach(a=>{t[a.status]++;if(a.status==="approved"){t[a.seat]++;if(a.paid)t.paid++}});
  return t;
}
function renderApps(){
  const d=dinner(),t=tally();
  $("counts").innerHTML=d?`
    <div class="count"><span>Guys approved</span><b class="${t.m>d.seats_m?"over":""}">${t.m} / ${d.seats_m}</b></div>
    <div class="count"><span>Girls approved</span><b class="${t.f>d.seats_f?"over":""}">${t.f} / ${d.seats_f}</b></div>
    <div class="count"><span>Paid</span><b>${t.paid} / ${t.approved}</b></div>
    <div class="count"><span>To review</span><b>${t.pending}</b></div>`:"";
  const F=[["all","All",APPS.length],["pending","To review",t.pending],["approved","Approved",t.approved],["waitlist","Waitlist",t.waitlist],["denied","Denied",t.denied],["m","Guys",APPS.filter(a=>a.seat==="m").length],["f","Girls",APPS.filter(a=>a.seat==="f").length]];
  $("filters").innerHTML=F.map(([k,l,n])=>`<button class="chip" type="button" data-f="${k}" aria-pressed="${filter===k}">${l} · ${n}</button>`).join("");
  const list=APPS.filter(a=>filter==="all"||a.status===filter||a.seat===filter);
  if(!APPS.length){$("apps").innerHTML=`<div class="empty" style="grid-column:1/-1">No applications for this dinner yet.</div>`;return}
  if(!list.length){$("apps").innerHTML=`<div class="empty" style="grid-column:1/-1">Nobody in this filter.</div>`;return}
  $("apps").innerHTML=list.map(appCard).join("");
}
function socialUrl(s){s=s.trim();if(/^https?:\/\//i.test(s))return s;if(/^[\w.-]+\.[a-z]{2,}\//i.test(s))return "https://"+s;return "https://instagram.com/"+s.replace(/^@/,"")}
function appCard(a){
  const d=dinner(),full=a.seat==="m"?tally().m>=d.seats_m:tally().f>=d.seats_f;
  const isArmed=armed===a.id;
  return `<article class="app" data-id="${a.id}">
    <div class="app-head">
      ${a._img?`<img class="selfie" src="${esc(a._img)}" alt="Selfie of ${esc(a.full_name)}" data-zoom>`:`<div class="selfie"></div>`}
      <div class="who">
        <div class="row" style="justify-content:space-between;gap:6px"><h3>${esc(a.full_name)}</h3><span class="status st-${a.status}">${a.status==="pending"?"to review":a.status}</span></div>
        <div class="tags"><span class="tag ${a.seat}">${a.seat==="m"?"Male":"Female"}</span><span class="tag">${ageOf(a.dob)} yrs</span><span class="tag">${esc(REL[a.relationship]||a.relationship)}</span><span class="tag">${esc(a.country)}</span>${a.observance?`<span class="tag">${esc(obsText(a))}</span>`:""}${a.kashrut?`<span class="tag">${esc(KOSHER[a.kashrut]||a.kashrut)}</span>`:""}</div>
        <dl class="details" style="margin-top:8px">
          <dt>Phone</dt><dd>${esc(a.phone)}</dd>
          <dt>Email</dt><dd>${esc(a.email)}</dd>
          <dt>Social</dt><dd><a href="${esc(socialUrl(a.social))}" target="_blank" rel="noopener">${esc(a.social)}</a></dd>
          <dt>Born</dt><dd>${esc(a.dob)}</dd>
        </dl>
      </div>
    </div>
    ${a.bio?`<p class="bio">${esc(a.bio)}</p>`:""}
    <div class="actions">
      <button class="btn sm act-approve" type="button" data-act="approved" aria-pressed="${a.status==="approved"}">${isArmed?"Side full · tap again":"Approve"}</button>
      <button class="btn sm act-waitlist" type="button" data-act="waitlist" aria-pressed="${a.status==="waitlist"}">Waitlist</button>
      <button class="btn sm act-deny" type="button" data-act="denied" aria-pressed="${a.status==="denied"}">Deny</button>
    </div>
    <div class="paidrow">
      ${a.status==="approved"?`<label class="switch"><input type="checkbox" data-paid ${a.paid?"checked":""}> Paid by Bit</label>`:`<span class="small muted">Applied ${new Date(a.created_at).toLocaleDateString()}</span>`}
      ${a.status!=="pending"?`<a class="btn sm wa" href="${waLink(a)}" target="_blank" rel="noopener">Send WhatsApp</a>`:""}
    </div>
  </article>`;
}
function fill(tpl,a){
  const d=dinner();
  const map={first:a.full_name.split(/\s+/)[0],name:a.full_name,dinner:d.title,date:fdate(d.dinner_date),price:d.price,hours:SETTINGS.pay_hours||"24",bit_phone:SETTINGS.bit_phone||"[Bit number]",bit_link:SETTINGS.bit_link||""};
  return (tpl||"").replace(/\\n/g,"\n").replace(/\{(\w+)\}/g,(m,k)=>k in map?map[k]:m).replace(/[ \t]+\n/g,"\n").trim();
}
function waLink(a){
  const tpl={approved:SETTINGS.msg_approved,waitlist:SETTINGS.msg_waitlist,denied:SETTINGS.msg_denied}[a.status];
  let num=a.phone.replace(/\D/g,"");if(num.startsWith("9720"))num="972"+num.slice(4);
  return `https://wa.me/${num}?text=${encodeURIComponent(fill(tpl,a))}`;
}
$("filters").onclick=e=>{const c=e.target.closest(".chip");if(!c)return;filter=c.dataset.f;renderApps()};
$("apps").addEventListener("click",async e=>{
  if(e.target.matches("[data-zoom]")){const lb=$("lightbox");lb.querySelector("img").src=e.target.src;lb.hidden=false;return}
  const b=e.target.closest("[data-act]");if(!b)return;
  const card=b.closest(".app"),a=APPS.find(x=>x.id===card.dataset.id),st=b.dataset.act;
  if(a.status===st)return;
  if(st==="approved"){
    const d=dinner(),t=tally(),full=a.seat==="m"?t.m>=d.seats_m:t.f>=d.seats_f;
    if(full&&armed!==a.id){armed=a.id;renderApps();return}
  }
  armed=null;b.disabled=true;
  const {error}=await sb.from("applications").update({status:st,decided_at:new Date().toISOString(),paid:st==="approved"?a.paid:false}).eq("id",a.id);
  if(error){toast("Couldn't save. Try again.");b.disabled=false;return}
  a.status=st;if(st!=="approved")a.paid=false;renderApps();
  toast({approved:"Approved",waitlist:"Moved to waitlist",denied:"Denied"}[st]+" · tap Send WhatsApp");
});
$("apps").addEventListener("change",async e=>{
  if(!e.target.matches("[data-paid]"))return;
  const a=APPS.find(x=>x.id===e.target.closest(".app").dataset.id),paid=e.target.checked;
  const {error}=await sb.from("applications").update({paid}).eq("id",a.id);
  if(error){e.target.checked=!paid;toast("Couldn't save. Try again.");return}
  a.paid=paid;renderApps();toast(paid?"Marked as paid":"Marked as unpaid");
});
$("lightbox").onclick=()=>$("lightbox").hidden=true;
$("csv").onclick=()=>{
  const d=dinner();if(!d||!APPS.length){toast("Nothing to export");return}
  const cols=["full_name","seat","status","paid","phone","email","social","dob","country","relationship","observance","kashrut","bio","created_at"];
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const csv=[cols.join(","),...APPS.map(a=>cols.map(c=>q(c==="seat"?(a.seat==="m"?"male":"female"):c==="observance"?obsText(a):c==="kashrut"?(KOSHER[a.kashrut]||""):a[c])).join(","))].join("\n");
  const blob=new Blob(["﻿"+csv],{type:"text/csv"});const u=URL.createObjectURL(blob);
  const l=document.createElement("a");l.href=u;l.download=`${d.dinner_date}-${d.title.replace(/\W+/g,"-")}.csv`;l.click();setTimeout(()=>URL.revokeObjectURL(u),2000);
};

/* ── dinners editor ── */
function renderDinnerList(){
  $("dlist").innerHTML=DINNERS.length?DINNERS.map(d=>`<div class="drow">
    <img src="${esc(d.image_url)}" alt="">
    <div class="info"><div class="eyebrow">${esc(fdate(d.dinner_date))}${d.published?"":" · hidden"}</div><h3>${esc(d.title)}</h3><div class="small muted">${esc(d.neighborhood)} · ₪${d.price} · ${d.seats_m}+${d.seats_f} seats</div></div>
    <div class="row"><button class="btn sm" type="button" data-edit="${d.id}">Edit</button><button class="btn sm ghost" type="button" data-view="${d.id}">Applicants</button></div>
  </div>`).join(""):`<div class="empty">No dinners yet. Tap “Add dinner” to post your first one.</div>`;
}
$("dlist").onclick=e=>{
  const ed=e.target.closest("[data-edit]"),vw=e.target.closest("[data-view]");
  if(ed)openEditor(DINNERS.find(d=>d.id===ed.dataset.edit));
  if(vw){$("dinnerSel").value=vw.dataset.view;filter="all";loadApps();document.querySelector('[data-tab="apps"]').click()}
};
$("newDinner").onclick=()=>openEditor(null);
let edImg=STOCK[0],delArmed=false;
function openEditor(d){
  const n=!d;d=d||{title:"",dinner_date:"",neighborhood:"",venue:"",doors:"19:30",candles:"",ages:"",dress:"",description:"",menu:[],price:220,seats_m:5,seats_f:5,image_url:STOCK[0],published:true};
  edImg=d.image_url;delArmed=false;
  const f=(id,label,val,type="text",ph="")=>`<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(val)}" placeholder="${esc(ph)}"></div>`;
  $("editor").innerHTML=`<form class="panel stack" id="dForm" style="margin-bottom:18px">
    <div class="row" style="justify-content:space-between"><h2 style="font-size:32px">${n?"New dinner":"Edit dinner"}</h2><button class="btn sm ghost" type="button" id="dCancel">Close</button></div>
    <div class="grid2">
      ${f("d_date","Date *",d.dinner_date,"date")}
      ${f("d_title","Dinner name *",d.title,"text","Rooftop Kiddush")}
    </div>
    <div class="grid2">
      ${f("d_hood","Neighborhood *",d.neighborhood,"text","Neve Tzedek")}
      ${f("d_venue","Venue (shown as “Where”)",d.venue,"text","Private rooftop, Neve Tzedek")}
    </div>
    <div class="grid3">
      ${f("d_doors","Doors open",d.doors,"text","19:30")}
      ${f("d_candles","Candle lighting",d.candles,"text","16:20")}
      ${f("d_ages","Ages",d.ages,"text","26–34")}
      ${f("d_price","Price per seat (₪) *",d.price,"number")}
      ${f("d_m","Guy seats",d.seats_m,"number")}
      ${f("d_f","Girl seats",d.seats_f,"number")}
    </div>
    ${f("d_dress","Dress code",d.dress,"text","Shabbat chic")}
    <div class="field"><label for="d_desc">Description *</label><textarea id="d_desc" rows="4" placeholder="What the night feels like…">${esc(d.description)}</textarea></div>
    <div class="field"><label for="d_menu">Menu <span class="muted">(one dish per line)</span></label><textarea id="d_menu" rows="4">${esc((d.menu||[]).join("\n"))}</textarea></div>
    <div class="field"><span style="font-size:13px;font-weight:700;display:block;margin-bottom:5px">Flyer photo</span>
      <div class="photos" id="photos"></div>
      <input id="d_upload" type="file" accept="image/*" hidden>
    </div>
    <label class="switch"><input type="checkbox" id="d_pub" ${d.published?"checked":""}> Show on the website</label>
    <p class="errmsg" id="dErr" hidden></p>
    <div class="row">
      <button class="btn primary" type="submit" id="dSave">${n?"Post dinner":"Save changes"}</button>
      ${n?"":`<button class="btn ghost" type="button" id="dDel" style="margin-left:auto;color:var(--err)">Delete dinner</button>`}
    </div>
  </form>`;
  $("editor").hidden=false;$("editor").dataset.id=n?"":d.id;renderPhotos();
  $("editor").scrollIntoView({behavior:"smooth",block:"start"});
  $("dCancel").onclick=()=>{$("editor").hidden=true};
  $("d_upload").onchange=uploadPhoto;
  $("dForm").onsubmit=saveDinner;
  if(!n)$("dDel").onclick=async()=>{
    if(!delArmed){delArmed=true;$("dDel").textContent="Deletes all its applicants too · tap again";return}
    const {error}=await sb.from("dinners").delete().eq("id",d.id);
    if(error){toast("Couldn't delete");return}
    $("editor").hidden=true;toast("Dinner deleted");await loadDinners();loadApps();
  };
}
function renderPhotos(){
  const imgs=[...new Set([...(STOCK.includes(edImg)?[]:[edImg]),...STOCK])];
  $("photos").innerHTML=imgs.map(u=>`<button type="button" class="photo" data-img="${esc(u)}" aria-pressed="${u===edImg}"><img src="${esc(u)}" alt=""></button>`).join("")+
    `<label class="upload" for="d_upload">＋<span>Upload your own</span></label>`;
  $("photos").onclick=e=>{const p=e.target.closest("[data-img]");if(p){edImg=p.dataset.img;renderPhotos()}};
}
function shrink(file,max=1600){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(),"image/jpeg",.84)};img.onerror=rej;img.src=URL.createObjectURL(file)})}
async function uploadPhoto(e){
  const file=e.target.files[0];if(!file)return;
  toast("Uploading photo…");
  try{
    const blob=await shrink(file);const path=`${crypto.randomUUID()}.jpg`;
    const {error}=await sb.storage.from("dinner-images").upload(path,blob,{contentType:"image/jpeg"});
    if(error)throw error;
    edImg=sb.storage.from("dinner-images").getPublicUrl(path).data.publicUrl;renderPhotos();toast("Photo added");
  }catch(err){toast("Upload failed. Try a different photo.")}
}
async function saveDinner(e){
  e.preventDefault();
  const v=id=>$(id).value.trim(),err=$("dErr");
  const row={dinner_date:v("d_date"),title:v("d_title"),neighborhood:v("d_hood"),venue:v("d_venue"),doors:v("d_doors"),candles:v("d_candles"),ages:v("d_ages"),
    price:parseInt(v("d_price"),10),seats_m:parseInt(v("d_m"),10)||0,seats_f:parseInt(v("d_f"),10)||0,dress:v("d_dress"),description:v("d_desc"),
    menu:v("d_menu").split("\n").map(s=>s.trim()).filter(Boolean),image_url:edImg,published:$("d_pub").checked};
  const miss=[!row.dinner_date&&"date",!row.title&&"dinner name",!row.neighborhood&&"neighborhood",!(row.price>=0)&&"price",!row.description&&"description"].filter(Boolean);
  if(miss.length){err.textContent="Please add the "+miss.join(", ")+".";err.hidden=false;return}
  err.hidden=true;$("dSave").disabled=true;
  const id=$("editor").dataset.id;
  const {error}=id?await sb.from("dinners").update(row).eq("id",id):await sb.from("dinners").insert(row);
  $("dSave").disabled=false;
  if(error){err.textContent="Couldn't save: "+error.message;err.hidden=false;return}
  $("editor").hidden=true;toast(id?"Dinner updated":"Dinner posted");await loadDinners();
}

/* ── settings ── */
const SKEYS=["bit_phone","bit_link","pay_hours","msg_approved","msg_waitlist","msg_denied"];
async function loadSettings(){
  const {data}=await sb.from("settings").select("*");
  SETTINGS={};(data||[]).forEach(r=>SETTINGS[r.key]=r.value.replace(/\\n/g,"\n"));
  SKEYS.forEach(k=>$("s_"+k).value=SETTINGS[k]||"");
}
$("setForm").onsubmit=async e=>{
  e.preventDefault();
  const rows=SKEYS.map(k=>({key:k,value:$("s_"+k).value.trim()}));
  const {error}=await sb.from("settings").upsert(rows);
  if(error){toast("Couldn't save settings");return}
  rows.forEach(r=>SETTINGS[r.key]=r.value);toast("Settings saved");renderApps();
};

boot();
</script>
</body>
</html>
