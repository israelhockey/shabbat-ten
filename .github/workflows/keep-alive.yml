# Pings the free Supabase project every 3 days so it never pauses for inactivity.
name: Keep Supabase awake
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping database
        run: |
          URL=$(grep -o 'SUPABASE_URL: "[^"]*"' config.js | cut -d'"' -f2)
          KEY=$(grep -o 'SUPABASE_ANON_KEY: "[^"]*"' config.js | cut -d'"' -f2)
          curl -fsS "$URL/rest/v1/dinners_public?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
